services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: foundation_audit
      POSTGRES_USER: foundation_audit
      POSTGRES_PASSWORD: foundation_audit_test_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundation_audit -d foundation_audit"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped